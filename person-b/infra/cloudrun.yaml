apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: echo-person-b
spec:
  template:
    spec:
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/echo/echo-person-b:latest
          ports:
            - containerPort: 8080
          env:
            - name: ECHO_DEMO_MODE
              value: "false"
            - name: GOOGLE_CLOUD_PROJECT
              value: "PROJECT_ID"
            - name: GOOGLE_CLOUD_LOCATION
              value: "us-central1"
            - name: GEMINI_MODEL
              value: "gemini-2.5-flash"
            - name: GCS_BUCKET
              value: "YOUR_BUCKET"
